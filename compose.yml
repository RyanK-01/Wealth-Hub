
services:

  db:
    image: postgres
    container_name: wealth-hub-container-name
    ports: 
      - "5433:5432"
    restart: always
    volumes:
      - postgres:/var/lib/postgressql/data
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: wealth-hub
      POSTGRES_DB: wealth-hub-db

volumes:
  postgres: